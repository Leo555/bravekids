<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta

    />
    <meta name="theme-color" content="#fbfcfe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小勇士打卡" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>BraveKids · 小勇士打卡乐园</title>
    <meta name="description" content="小朋友运动 + 学习打卡乐园，记录每一天的成长与进步" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BraveKids · 小勇士打卡乐园" />
    <meta property="og:description" content="小朋友运动 + 学习打卡乐园，记录每一天的成长与进步" />
    <meta property="og:image" content="https://kids.lz5z.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 存档只在云端，首屏必须等 /api/state 返回。
      // 这里在 HTML 解析阶段就把请求发出去，和主 JS 的下载 / 解析并行，
      // 省掉「下载 JS → 解析 JS → 才发请求」这段串行等待。
      (function () {
        try {
          var code = localStorage.getItem('bravekids-passcode');
          if (!code) return;
          window.__bkState = fetch('/api/state', {
            headers: { Accept: 'application/json', Authorization: 'Bearer ' + code },
          });
          // 先挂一个空的 catch，避免请求失败时抛 unhandledrejection
          window.__bkState.catch(function () {});
        } catch (e) {
          /* 隐私模式拿不到 localStorage，走正常流程即可 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
